version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    groups:
      action-patches:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: swift
    directory: /ios/FlowDropCore
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
