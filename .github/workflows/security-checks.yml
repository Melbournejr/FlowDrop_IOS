name: Repository security checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  workflow-safety:
    name: Workflow safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test security policy against unsafe fixtures
        run: python3 .github/scripts/test_security_policy.py
      - name: Audit tracked files and workflow permissions
        run: python3 .github/scripts/audit_workflows.py
